name: OpenDock constraints

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-grader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd benchmarks/ux-loop --frozen-lockfile --ignore-scripts
      - name: Prepare Chromium for the evaluator tests
        working-directory: benchmarks/ux-loop
        run: bunx playwright install --with-deps chromium
      - name: Test grading and metrics without calling a model
        working-directory: benchmarks/ux-loop
        run: bun test ./tests
  validate-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Check out the pinned OpenDock implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JeongYunSung/OpenDock
          ref: 8c41853fc6af8130d06fc9be713d462104438b87
          path: upstream-opendock
          persist-credentials: false
      - name: Prepare upstream dependencies for compatibility checks
        run: bun install --cwd upstream-opendock --frozen-lockfile --ignore-scripts --filter opendock
      - name: Verify official packaging and install/update/uninstall behavior
        run: bun run test:opendock upstream-opendock
      - run: bun run release:prepare
      - name: Save the publishable directory and checksum inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-loop-opendock
          path: dist/
          if-no-files-found: error
