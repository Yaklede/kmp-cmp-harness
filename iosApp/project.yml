name: HarnessSample
options:
  bundleIdPrefix: dev.harness
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  HarnessSample:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.harness.sample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUI/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework HarnessUI"
    preBuildScripts:
      - name: Build shared Compose framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
schemes:
  HarnessSample:
    build:
      targets:
        HarnessSample: all
